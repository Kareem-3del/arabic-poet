[project]
name = "arabic-poet"
version = "0.1.0"
description = "Meter-constrained decoding for classical Arabic poetry: code, poems and scores behind the report Form Without Meaning."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "mlx>=0.32,<0.33",
    "mlx-lm>=0.32,<0.33",
    "huggingface-hub>=1.0",
    "typer>=0.28",
    "pydantic>=2.14,<3",
    "pyyaml>=6.0",
    "rich>=15",
    "psutil>=7",
    # Meter/rhyme scoring: CATT diacritizer (Apache-2.0) + pyarud rule-based arud (MIT).
    "pyarud==1.0.0",
    "catt-tashkeel==1.0.2",
    "onnxruntime>=1.22",
]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.17"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arabic_poet"]

[tool.uv]
# catt-tashkeel declares onnxruntime-gpu, which has no macOS wheels; the CPU package
# `onnxruntime` (above) provides the same `onnxruntime` module. Drop the GPU requirement.
override-dependencies = ["onnxruntime-gpu; sys_platform == 'never'"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["kaggle"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003: Arabic text legitimately contains characters ruff flags as "ambiguous".
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs the downloaded model weights (slow)"]
addopts = "-m 'not model'"
